services:
  - type: web
    name: bookmovies-app
    env: node
    buildCommand: cd client && npm install && npm run build
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: mongo_url
        sync: false
      - key: jwt_secret
        sync: false
      - key: stripe_key
        sync: false
